<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimal Task Manager</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="card">
    <h2>Task Manager</h2>

    <!-- Single Input & Submit Button -->
    <form id="task-form">
      <input type="text" id="task-input" placeholder="Enter task title..." autocomplete="off" required />
      <button type="submit" id="submit-btn">Add Task</button>
    </form>

    <!-- Task List -->
    <ul id="task-list">
      
    </ul>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
